name: Bug report
description: Report a reproducible GraphLean defect
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: GraphLean version }
    validations: { required: true }
  - type: input
    id: dsh
    attributes: { label: DeepSeek Harness version }
    validations: { required: true }
  - type: textarea
    id: reproduction
    attributes: { label: Minimal reproduction }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected host decision }
    validations: { required: true }
  - type: textarea
    id: observed
    attributes: { label: Observed host decision }
    validations: { required: true }

