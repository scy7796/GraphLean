name: Feature request
description: Propose a narrowly scoped governance capability
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: Governance problem, description: Describe the concrete enforcement gap rather than a broad agent feature. }
    validations: { required: true }
  - type: textarea
    id: invariant
    attributes: { label: Proposed host-enforced invariant }
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes: { label: How should it be tested? }
    validations: { required: true }

