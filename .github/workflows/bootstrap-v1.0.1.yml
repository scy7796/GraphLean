name: bootstrap-v1.0.1

on:
  push:
    branches:
      - fix/v1.0.1-release-loop

permissions:
  contents: write

jobs:
  apply-reviewed-fix:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Canonicalize tracked source text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          skip={'.git','.bootstrap','dist','build','__pycache__','.pytest_cache'}
          for p in Path('.').rglob('*'):
              if not p.is_file() or any(part in skip for part in p.parts):
                  continue
              try:
                  text=p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              text=text.replace('\r\n','\n').replace('\r','\n').rstrip('\n')+'\n'
              p.write_text(text,encoding='utf-8',newline='\n')
          PY
      - name: Reconstruct and verify reviewed patch plus exact conflict overlay
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, pathlib, tarfile, zlib
          parts=sorted(pathlib.Path('.bootstrap').glob('fix.z.b64.part*'))
          assert len(parts)==3, f'expected 3 patch parts, got {len(parts)}'
          encoded=''.join(p.read_text(encoding='ascii').strip() for p in parts)
          patch=zlib.decompress(base64.b64decode(encoded, validate=True))
          patch_sha=hashlib.sha256(patch).hexdigest()
          expected_patch='b8895821e65c0bfc4eacb033652243f85d3e84ade7933fa378be3a6887fbe523'
          assert patch_sha==expected_patch, f'patch sha mismatch: {patch_sha}'
          pathlib.Path('/tmp/graphlean-v1.0.1.patch').write_bytes(patch)

          overlay_b64=pathlib.Path('.bootstrap/conflict-overlay.tgz.b64').read_text(encoding='ascii').strip()
          overlay=base64.b64decode(overlay_b64, validate=True)
          overlay_sha=hashlib.sha256(overlay).hexdigest()
          expected_overlay='145973196532ae3d9d9d01174aec04736870a5fdc47094a6544082a23e151d22'
          assert overlay_sha==expected_overlay, f'overlay sha mismatch: {overlay_sha}'
          overlay_path=pathlib.Path('/tmp/graphlean-v1.0.1-overlay.tar.gz')
          overlay_path.write_bytes(overlay)
          allowed={'GITHUB_RELEASE.md','README.md','tests/test_evolution.py','tests/test_privacy.py','tests/test_templates.py'}
          dest=pathlib.Path('/tmp/graphlean-v1.0.1-overlay')
          dest.mkdir(parents=True,exist_ok=True)
          with tarfile.open(overlay_path,'r:gz') as tf:
              names={m.name for m in tf.getmembers()}
              assert names==allowed, f'overlay file set mismatch: {names}'
              for m in tf.getmembers():
                  assert m.isfile() and not m.issym() and not m.islnk(), m.name
                  target=(dest/m.name).resolve()
                  assert target.is_relative_to(dest.resolve()), m.name
              tf.extractall(dest)
          print('verified patch', patch_sha, 'bytes', len(patch))
          print('verified overlay', overlay_sha, 'bytes', len(overlay))
          PY
          excludes=(
            --exclude=CHECKSUMS.sha256
            --exclude=MANIFEST.json
            --exclude=GITHUB_RELEASE.md
            --exclude=README.md
            --exclude=tests/test_evolution.py
            --exclude=tests/test_privacy.py
            --exclude=tests/test_templates.py
          )
          git apply --check "${excludes[@]}" /tmp/graphlean-v1.0.1.patch
          git apply "${excludes[@]}" /tmp/graphlean-v1.0.1.patch
          cp -a /tmp/graphlean-v1.0.1-overlay/. ./
      - name: Remove bootstrap and generated release residue
        shell: bash
        run: |
          rm -rf .bootstrap dist pre_release_validation
          rm -f MANIFEST.json CHECKSUMS.sha256 .github/workflows/bootstrap-v1.0.1.yml
      - name: Run fixed-source validation
        shell: bash
        run: |
          python -m pip install -r requirements-dev.txt
          node --check dsh/index.js
          node --check bin/graphleanctl.mjs
          python -B -m unittest discover -s tests -v
          python -B SELFTEST.py --source-tree
          node benchmarks/measure-context-surface.mjs
      - name: Commit exact fixed source
        shell: bash
        run: |
          git add -A
          git diff --cached --check
          test -n "$(git status --porcelain)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Harden v1.0.1 release pipeline and cross-platform validation'
          git push origin HEAD:${GITHUB_REF_NAME}
