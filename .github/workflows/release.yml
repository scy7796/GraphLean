name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - run: python -m pip install -r requirements-dev.txt
      - run: mkdir -p dist && python -B RELEASE.py --output-dir dist
      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import json, os
          version=json.load(open('package.json',encoding='utf-8'))['version']
          tag=os.environ['GITHUB_REF_NAME']
          assert tag == 'v'+version, f'tag {tag} != package v{version}'
          print('tag/version match:', tag)
          PY
      - uses: softprops/action-gh-release@v2
        with:
          body_path: GITHUB_RELEASE.md
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          files: |
            dist/graphlean-*.zip
            dist/graphlean-*.zip.sha256
            dist/graphlean-*.tgz
            dist/graphlean-*.tgz.sha256
            dist/SHA256SUMS.txt

